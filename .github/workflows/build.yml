name: Build

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine required Java version
        id: java
        run: |
          # build.gradle の options.release を読み、なければ 17 にフォールバック
          RELEASE=$(grep -oE 'options\.release\s*=\s*[0-9]+' build.gradle | grep -oE '[0-9]+' | head -1)
          echo "version=${RELEASE:-17}" >> "$GITHUB_OUTPUT"
          echo "Using Java ${RELEASE:-17} for this branch"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ steps.java.outputs.version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mysb-build-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 14
