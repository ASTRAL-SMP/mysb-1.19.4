plugins {
    id 'fabric-loom' version '1.2-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'DV8tion'
        url = 'https://m2.dv8tion.net/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly files('/home/nixos/AST-DiscordHub/build/devlibs/ast-discordhub-0.1.0-dev.jar')
    compileOnly "org.scala-lang:scala-library:2.13.12"
    compileOnly "org.scala-lang:scala3-library_3:3.3.3"

    // JDA (Discord Bot) and its transitive dependencies
    implementation("net.dv8tion:JDA:5.0.0-beta.18") {
        exclude module: 'opus-java'  // 音声機能不要
    }
    include "net.dv8tion:JDA:5.0.0-beta.18"
    include "net.sf.trove4j:trove4j:3.0.3"
    include "com.neovisionaries:nv-websocket-client:2.14"
    include "com.squareup.okhttp3:okhttp:4.12.0"
    include "com.squareup.okio:okio:3.6.0"
    include "com.squareup.okio:okio-jvm:3.6.0"
    include "org.apache.commons:commons-collections4:4.4"
    include "com.fasterxml.jackson.core:jackson-core:2.16.0"
    include "com.fasterxml.jackson.core:jackson-databind:2.16.0"
    include "com.fasterxml.jackson.core:jackson-annotations:2.16.0"
    include "org.jetbrains.kotlin:kotlin-stdlib:1.9.21"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
